[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-infer-router"
version = "0.1.0"
description = "Intelligent router over edge inference backends (exo, vLLM, Ollama)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Pluribus contributors"}]
dependencies = []

[project.scripts]
eir = "edge_infer_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

